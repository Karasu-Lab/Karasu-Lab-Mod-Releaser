name: 'KarasuLab Mod Releaser'
description: 'Automated release workflow for Minecraft mods using Release Please and mc-publish.'
author: 'KarasuLab'
branding:
  icon: 'package'
  color: 'blue'
inputs:
  modrinth_project_id:
    description: 'Modrinth Project ID'
    required: true
  modrinth_token:
    description: 'Modrinth Token'
    required: true
  curseforge_project_id:
    description: 'CurseForge Project ID'
    required: true
  curseforge_token:
    description: 'CurseForge Token'
    required: true
  config_path:
    description: 'Path to the config file'
    required: false
    default: 'karasulab-mod-releaser-config.json'
  release_please_config:
    description: 'Path to release-please-config.json'
    required: false
    default: 'release-please-config.json'
  release_please_manifest:
    description: 'Path to .release-please-manifest.json'
    required: false
    default: '.release-please-manifest.json'
  working_directory:
    description: 'Working directory for the mod project'
    required: false
    default: '.'

runs:
  using: "composite"
  steps:
    - name: Run Release Please
      id: release
      uses: googleapis/release-please-action@v4
      with:
        token: ${{ github.token }}
        config-file: ${{ inputs.release_please_config }}
        manifest-file: ${{ inputs.release_please_manifest }}
        target-branch: ${{ github.ref_name }}

    - name: Checkout
      if: ${{ steps.release.outputs.release_created }}
      uses: actions/checkout@v4

    - name: Load Config
      if: ${{ steps.release.outputs.release_created }}
      id: config
      shell: bash
      run: bash ${{ github.action_path }}/scripts/load-config.sh "${{ inputs.working_directory }}" "${{ inputs.config_path }}"

    - name: Resolve Dependencies
      if: ${{ steps.release.outputs.release_created }}
      id: deps
      shell: bash
      run: bash ${{ github.action_path }}/scripts/resolve-dependencies.sh "${{ inputs.working_directory }}" "${{ inputs.config_path }}"

    - name: Extract Gradle Properties
      if: ${{ steps.release.outputs.release_created }}
      id: props
      shell: bash
      run: bash ${{ github.action_path }}/scripts/extract-props.sh "${{ inputs.working_directory }}"

    - name: Construct Names
      if: ${{ steps.release.outputs.release_created }}
      id: names
      shell: bash
      run: |
        bash ${{ github.action_path }}/scripts/construct-names.sh \
          "${{ steps.config.outputs.release_title_format }}" \
          "${{ steps.config.outputs.jar_name_format }}" \
          "${{ steps.props.outputs.archives_base_name }}" \
          "${{ steps.props.outputs.minecraft_version }}" \
          "${{ steps.props.outputs.mod_version }}" \
          "${{ steps.release.outputs.tag_name }}"

    - name: Set up JDK
      if: ${{ steps.release.outputs.release_created }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ steps.config.outputs.java_version }}
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      if: ${{ steps.release.outputs.release_created }}
      shell: bash
      run: chmod +x gradlew

    - name: Build Included Builds
      if: ${{ steps.release.outputs.release_created }}
      shell: bash
      run: bash ${{ github.action_path }}/scripts/build-included-builds.sh "${{ inputs.working_directory }}"

    - name: Build with Gradle
      if: ${{ steps.release.outputs.release_created }}
      shell: bash
      run: ./gradlew build

    - name: Upload to GitHub Release
      if: ${{ steps.release.outputs.release_created }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        TARGET_DIR="${{ inputs.working_directory }}"
        gh release upload ${{ steps.release.outputs.tag_name }} \
          "$TARGET_DIR/build/libs/${{ steps.names.outputs.final_jar_name }}" \
          --clobber

    - name: Publish to Modrinth & CurseForge
      if: ${{ steps.release.outputs.release_created }}
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: ${{ inputs.modrinth_project_id }}
        modrinth-token: ${{ inputs.modrinth_token }}
        curseforge-id: ${{ inputs.curseforge_project_id }}
        curseforge-token: ${{ inputs.curseforge_token }}
        files: |
          ${{ inputs.working_directory }}/build/libs/${{ steps.names.outputs.final_jar_name }}
        name: "${{ steps.names.outputs.final_release_title }}"
        version: ${{ steps.release.outputs.tag_name }}
        version-type: release
        changelog: ${{ steps.release.outputs.body }}
        loaders: ${{ steps.config.outputs.loaders }}
        game-versions: ${{ steps.props.outputs.minecraft_version }}
        dependencies: ${{ steps.deps.outputs.mc_publish_deps }}
        java: ${{ steps.config.outputs.java_version }}
