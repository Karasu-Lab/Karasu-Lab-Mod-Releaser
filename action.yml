name: "KarasuLab Mod Releaser"
description: "Automated release workflow for Minecraft mods using Modrinth and CurseForge API."
author: "KarasuLab"
branding:
  icon: "package"
  color: "blue"

inputs:
  modrinth_token:
    description: "Modrinth API Token"
    required: false
  curseforge_token:
    description: "CurseForge API Token"
    required: false
  config_path:
    description: "Path to the config file"
    required: false
    default: "karasulab-mod-releaser-config.json"
  working_directory:
    description: "Working directory for the mod project"
    required: false
    default: "."
  files:
    description: "Files to upload (e.g., build/libs/*.jar), supports glob patterns"
    required: true
  version_name:
    description: "The name of the version (e.g. 1.0.0)"
    required: true
  changelog:
    description: "Changelog content"
    required: false

runs:
  using: "node20"
  main: "dist/index.js"
